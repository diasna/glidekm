[workspace]
resolver = "2"
members = ["crates/core", "crates/client", "crates/server", "crates/settings-deck", "crates/release-tool"]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
