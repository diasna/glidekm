[package]
name = "glidekm-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "glidekm settings window for SteamOS Desktop Mode / Linux"

[dependencies]
glidekm-core = { path = "../core" }
libc = "0.2"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
